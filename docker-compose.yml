services:
  monic:
    image: ghcr.io/mikhail-angelov/monic:latest
    container_name: monic
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - ./.env

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:8765:8765"
